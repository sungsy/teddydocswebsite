title: Teddy-Docs Bayreuth
tagline: Teddybärkrankenhaus am Medizincampus Oberfranken
# Erscheint bei Google unter dem Titel – max. ca. 155 Zeichen.
description: "Teddybärkrankenhaus Bayreuth: Medizinstudierende nehmen Kindern spielerisch die Angst vor medizinischen Untersuchungen. Kostenfrei für Vorschulkinder und 1./2. Klassen."
lang: de
locale: de_DE
logo: /assets/img/logo.png

# Adresse der Seite. Bei eigener Domain z. B. url: "https://www.teddydocs-bayreuth.de" und baseurl: "".
url: "https://sungsy.github.io"
baseurl: "/teddydocswebsite"

plugins:
  - jekyll-seo-tag   # Titel, Beschreibung, Canonical, Vorschau für WhatsApp/Social Media, strukturierte Daten
  - jekyll-sitemap   # erzeugt /sitemap.xml

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/logo.png

buchung:
  # Web-App-URL des Google Apps Scripts (endet auf /exec) – siehe README.md, Schritt 2.
  apps_script_url: "https://script.google.com/macros/s/AKfycbxUV0RppTg3rVxMVOw8AEsyKiWqyGadNJNIYiRFwRRqhYb0btZK0Zhv1KQEy0QLNhMknQ/exec"

  # Die buchbaren Termine (Datum + Uhrzeit) stehen im Blatt „Termine“ der Google-Tabelle – siehe README.md.
  # Dieser Satz erscheint auf der Seite bei den Eckdaten über dem Kalender.
  zeiten_hinweis: "Meist freitags vormittags"

  # Richtwert Kinder pro Termin (wird auf der Seite angezeigt).
  kinder_pro_termin: 25

  # Wie viele Tage im Voraus muss mindestens angefragt werden? Frühere Termine werden ausgeblendet.
  vorlauf_tage: 21

exclude:
  - README.md
  - apps-script
